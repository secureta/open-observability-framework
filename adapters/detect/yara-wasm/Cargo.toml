[package]
name = "oof-yara-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Zero-runtime-codegen WASM YARA engine (boreal) for Cloudflare Workers observability ingestion"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
boreal = { version = "1.4.0", default-features = false, features = ["hash"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"
