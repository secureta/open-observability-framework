# Open Observability Framework — Vector Collector (OCSF v1.3.0 -> Direct Basin HTTP)
#
# Collects Linux host `systemd-journald` events AND local OTLP logs (`127.0.0.1:4317` gRPC,
# `127.0.0.1:4318` HTTP protobuf), normalizes both into official OCSF v1.3.0
# `Event Log Activity` (`category_uid: 1`, `class_uid: 1008`, `activity_id: 99`),
# and ships gzipped JSON arrays directly to Cloudflare Basin HTTP (`direct-basin-http`).
#
# Required environment variables:
#   OOF_BASIN_ENDPOINT   (e.g. https://<STREAM_ID>.ingest.cloudflare.com)
#   OOF_INGEST_TOKEN     (Cloudflare Account API Token with `Basin Pipelines Send`)
#
# Optional environment variables:
#   OOF_VECTOR_DATA_DIR    (default: /var/lib/vector)
#   OOF_OTLP_GRPC_LISTEN   (default: 127.0.0.1:4317; set to 127.0.0.1:4319 if bridging behind co-located otelcol)
#   OOF_OTLP_HTTP_LISTEN   (default: 127.0.0.1:4318; set to 127.0.0.1:4320 if bridging behind co-located otelcol)
#
# Vector >= 0.60 note:
#   Interpolating environment variables (e.g. `$OOF_BASIN_ENDPOINT` with braces) requires `--dangerously-allow-env-var-interpolation`
#   (or `VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true`):
#     vector validate --no-environment --dangerously-allow-env-var-interpolation adapters/collect/vector-journald/vector.yaml
#     vector test --no-environment --dangerously-allow-env-var-interpolation adapters/collect/vector-journald/vector.yaml

data_dir: "${OOF_VECTOR_DATA_DIR:-/var/lib/vector}"

sources:
  journald:
    type: journald
    current_boot_only: false

  otlp:
    type: opentelemetry
    grpc:
      address: "${OOF_OTLP_GRPC_LISTEN:-127.0.0.1:4317}"
    http:
      address: "${OOF_OTLP_HTTP_LISTEN:-127.0.0.1:4318}"

transforms:
  ocsf_journald:
    type: remap
    inputs:
      - journald
    source: |
      orig = .
      now_ts = now()

      # Resolve primary event timestamp within 4-digit UTC RFC 3339 bounds (0001..9999 -> [1, 253402300799999] ms):
      # _SOURCE_REALTIME_TIMESTAMP (us) -> __REALTIME_TIMESTAMP (us) -> .timestamp -> now()
      event_ts = now_ts
      ts_resolved = false

      if exists(orig._SOURCE_REALTIME_TIMESTAMP) && orig._SOURCE_REALTIME_TIMESTAMP != null {
        src_us = -1
        if is_integer(orig._SOURCE_REALTIME_TIMESTAMP) {
          si = int!(orig._SOURCE_REALTIME_TIMESTAMP)
          if si >= 1000 && si <= 9007199254740991 { src_us = si }
        } else if is_string(orig._SOURCE_REALTIME_TIMESTAMP) {
          s_us = string!(orig._SOURCE_REALTIME_TIMESTAMP)
          if match(s_us, r'^[0-9]{1,18}$') {
            u_parsed, u_err = to_int(s_us)
            if u_err == null { src_us = u_parsed }
          }
        }
        if src_us >= 1000 && src_us <= 253402300799999999 {
          parsed_ts, p_err = from_unix_timestamp(src_us, unit: "microseconds")
          if p_err == null {
            event_ts = parsed_ts
            ts_resolved = true
          }
        }
      }

      rt_ts = now_ts
      rt_valid = false
      if exists(orig.__REALTIME_TIMESTAMP) && orig.__REALTIME_TIMESTAMP != null {
        rt_us = -1
        if is_integer(orig.__REALTIME_TIMESTAMP) {
          ri = int!(orig.__REALTIME_TIMESTAMP)
          if ri >= 1000 && ri <= 9007199254740991 { rt_us = ri }
        } else if is_string(orig.__REALTIME_TIMESTAMP) {
          r_us = string!(orig.__REALTIME_TIMESTAMP)
          if match(r_us, r'^[0-9]{1,18}$') {
            u_parsed, u_err = to_int(r_us)
            if u_err == null { rt_us = u_parsed }
          }
        }
        if rt_us >= 1000 && rt_us <= 253402300799999999 {
          parsed_rt, l_err = from_unix_timestamp(rt_us, unit: "microseconds")
          if l_err == null {
            rt_ts = parsed_rt
            rt_valid = true
          }
        }
      }

      if !ts_resolved && rt_valid {
        event_ts = rt_ts
        ts_resolved = true
      }

      if !ts_resolved && exists(orig.timestamp) && orig.timestamp != null {
        if is_timestamp(orig.timestamp) {
          ts_v = timestamp!(orig.timestamp)
          cand_ms = to_unix_timestamp(ts_v, unit: "milliseconds")
          if cand_ms >= 1 && cand_ms <= 253402300799999 {
            event_ts = ts_v
            ts_resolved = true
          }
        } else if is_string(orig.timestamp) {
          ts_str = string!(orig.timestamp)
          if ts_str != "" {
            parsed_ts, p_err = parse_timestamp(ts_str, "%+")
            if p_err == null {
              cand_ms = to_unix_timestamp(parsed_ts, unit: "milliseconds")
              if cand_ms >= 1 && cand_ms <= 253402300799999 {
                event_ts = parsed_ts
                ts_resolved = true
              }
            }
          }
        }
      }

      time_ms = to_unix_timestamp(event_ts, unit: "milliseconds")
      time_dt = format_timestamp!(event_ts, "%Y-%m-%dT%H:%M:%S%.3fZ")
      logged_ms = to_unix_timestamp(rt_ts, unit: "milliseconds")

      # Map syslog PRIORITY (0..7) strictly to OCSF v1.3.0 severity_id / severity
      prio_val = null
      raw_prio = null
      if exists(orig.PRIORITY) && orig.PRIORITY != null {
        if is_integer(orig.PRIORITY) {
          pi = int!(orig.PRIORITY)
          if pi >= -9007199254740991 && pi <= 9007199254740991 {
            raw_prio = to_string(pi)
          }
          if pi >= 0 && pi <= 7 { prio_val = pi }
        } else if is_string(orig.PRIORITY) {
          ps = string!(orig.PRIORITY)
          if ps != "" { raw_prio = ps }
          if match(ps, r'^[0-7]$') { prio_val = to_int!(ps) }
        }
      }

      severity_id = 0
      severity = "Unknown"
      if prio_val == 0 {
        severity_id = 6
        severity = "Fatal"
      } else if prio_val == 1 || prio_val == 2 {
        severity_id = 5
        severity = "Critical"
      } else if prio_val == 3 {
        severity_id = 4
        severity = "High"
      } else if prio_val == 4 {
        severity_id = 3
        severity = "Medium"
      } else if prio_val == 5 {
        severity_id = 2
        severity = "Low"
      } else if prio_val == 6 || prio_val == 7 {
        severity_id = 1
        severity = "Informational"
      }

      msg = null
      if exists(orig.MESSAGE) && orig.MESSAGE != null {
        msg = if is_string(orig.MESSAGE) { string!(orig.MESSAGE) } else { encode_json(orig.MESSAGE) }
      } else if exists(orig.message) && orig.message != null {
        msg = if is_string(orig.message) { string!(orig.message) } else { encode_json(orig.message) }
      }

      systemd_unit = if exists(orig._SYSTEMD_UNIT) && is_string(orig._SYSTEMD_UNIT) && string!(orig._SYSTEMD_UNIT) != "" { string!(orig._SYSTEMD_UNIT) } else { null }
      syslog_identifier = if exists(orig.SYSLOG_IDENTIFIER) && is_string(orig.SYSLOG_IDENTIFIER) && string!(orig.SYSLOG_IDENTIFIER) != "" { string!(orig.SYSLOG_IDENTIFIER) } else { null }
      transport = if exists(orig._TRANSPORT) && is_string(orig._TRANSPORT) && string!(orig._TRANSPORT) != "" { string!(orig._TRANSPORT) } else { null }
      comm = if exists(orig._COMM) && is_string(orig._COMM) && string!(orig._COMM) != "" { string!(orig._COMM) } else { null }
      exe = if exists(orig._EXE) && is_string(orig._EXE) && string!(orig._EXE) != "" { string!(orig._EXE) } else { null }
      cmdline = if exists(orig._CMDLINE) && is_string(orig._CMDLINE) && string!(orig._CMDLINE) != "" { string!(orig._CMDLINE) } else { null }
      boot_id = if exists(orig._BOOT_ID) && is_string(orig._BOOT_ID) && string!(orig._BOOT_ID) != "" { string!(orig._BOOT_ID) } else { null }
      machine_id = if exists(orig._MACHINE_ID) && is_string(orig._MACHINE_ID) && string!(orig._MACHINE_ID) != "" { string!(orig._MACHINE_ID) } else { null }
      cursor = if exists(orig.__CURSOR) && is_string(orig.__CURSOR) && string!(orig.__CURSOR) != "" { string!(orig.__CURSOR) } else { null }
      facility = null
      if exists(orig.SYSLOG_FACILITY) && orig.SYSLOG_FACILITY != null {
        if is_string(orig.SYSLOG_FACILITY) && string!(orig.SYSLOG_FACILITY) != "" {
          facility = string!(orig.SYSLOG_FACILITY)
        } else if is_integer(orig.SYSLOG_FACILITY) {
          fi = int!(orig.SYSLOG_FACILITY)
          if fi >= -9007199254740991 && fi <= 9007199254740991 {
            facility = to_string(fi)
          }
        }
      }

      hostname = null
      if exists(orig._HOSTNAME) && is_string(orig._HOSTNAME) && string!(orig._HOSTNAME) != "" {
        hostname = string!(orig._HOSTNAME)
      } else if exists(orig.host) && is_string(orig.host) && string!(orig.host) != "" {
        hostname = string!(orig.host)
      }

      log_name = if systemd_unit != null { systemd_unit } else if syslog_identifier != null { syslog_identifier } else { comm }
      log_provider = if transport != null { transport } else { "systemd-journald" }

      # Extract optional correlation trace_id / span_id (skip empty or all-zero candidates before falling back)
      correlation_uid = null
      if exists(orig.TRACE_ID) && is_string(orig.TRACE_ID) {
        rt = string!(orig.TRACE_ID)
        if rt != "" && !match(rt, r'^0+$') {
          correlation_uid = if match(rt, r'^[0-9A-Fa-f]+$') { downcase(rt) } else { rt }
        }
      }
      if correlation_uid == null && exists(orig.OTEL_TRACE_ID) && is_string(orig.OTEL_TRACE_ID) {
        rt = string!(orig.OTEL_TRACE_ID)
        if rt != "" && !match(rt, r'^0+$') {
          correlation_uid = if match(rt, r'^[0-9A-Fa-f]+$') { downcase(rt) } else { rt }
        }
      }
      if correlation_uid == null && exists(orig.trace_id) && is_string(orig.trace_id) {
        rt = string!(orig.trace_id)
        if rt != "" && !match(rt, r'^0+$') {
          correlation_uid = if match(rt, r'^[0-9A-Fa-f]+$') { downcase(rt) } else { rt }
        }
      }

      span_clean = null
      if exists(orig.SPAN_ID) && is_string(orig.SPAN_ID) {
        rs = string!(orig.SPAN_ID)
        if rs != "" && !match(rs, r'^0+$') {
          span_clean = if match(rs, r'^[0-9A-Fa-f]+$') { downcase(rs) } else { rs }
        }
      }
      if span_clean == null && exists(orig.OTEL_SPAN_ID) && is_string(orig.OTEL_SPAN_ID) {
        rs = string!(orig.OTEL_SPAN_ID)
        if rs != "" && !match(rs, r'^0+$') {
          span_clean = if match(rs, r'^[0-9A-Fa-f]+$') { downcase(rs) } else { rs }
        }
      }
      if span_clean == null && exists(orig.span_id) && is_string(orig.span_id) {
        rs = string!(orig.span_id)
        if rs != "" && !match(rs, r'^0+$') {
          span_clean = if match(rs, r'^[0-9A-Fa-f]+$') { downcase(rs) } else { rs }
        }
      }

      # Actor process & user (strict integer parsing with fallback; actor.user.uid is always string_t in OCSF)
      pid_val = null
      if exists(orig._PID) && orig._PID != null {
        if is_integer(orig._PID) {
          pi = int!(orig._PID)
          if pi >= 0 && pi <= 9007199254740991 { pid_val = pi }
        } else if is_string(orig._PID) {
          ps = string!(orig._PID)
          if match(ps, r'^[0-9]{1,15}$') { pid_val = to_int!(ps) }
        }
      }
      if pid_val == null && exists(orig.SYSLOG_PID) && orig.SYSLOG_PID != null {
        if is_integer(orig.SYSLOG_PID) {
          pi = int!(orig.SYSLOG_PID)
          if pi >= 0 && pi <= 9007199254740991 { pid_val = pi }
        } else if is_string(orig.SYSLOG_PID) {
          ps = string!(orig.SYSLOG_PID)
          if match(ps, r'^[0-9]{1,15}$') { pid_val = to_int!(ps) }
        }
      }

      uid_str = null
      uid_num = null
      if exists(orig._UID) && orig._UID != null {
        if is_integer(orig._UID) {
          uv = int!(orig._UID)
          if uv >= 0 && uv <= 9007199254740991 {
            uid_str = to_string(uv)
            uid_num = uv
          }
        } else if is_string(orig._UID) {
          us = string!(orig._UID)
          if us != "" {
            uid_str = us
            if match(us, r'^[0-9]{1,15}$') { uid_num = to_int!(us) }
          }
        }
      }

      proc = {}
      if pid_val != null { proc.pid = pid_val }
      proc_name = if comm != null { comm } else { syslog_identifier }
      if proc_name != null { proc.name = proc_name }
      if exe != null { proc.path = exe }
      if cmdline != null { proc.cmd_line = cmdline }

      usr = {}
      if uid_str != null { usr.uid = uid_str }
      if uid_num != null { usr.uid_numeric = uid_num }

      act = {}
      if length(proc) > 0 { act.process = proc }
      if length(usr) > 0 { act.user = usr }

      meta = {
        "version": "1.3.0",
        "product": {
          "name": "Vector",
          "vendor_name": "Datadog"
        },
        "logged_time": logged_ms
      }
      if cursor != null { meta.original_event_uid = cursor }
      if correlation_uid != null { meta.correlation_uid = correlation_uid }
      if log_name != null { meta.log_name = log_name }
      if log_provider != null { meta.log_provider = log_provider }
      if raw_prio != null { meta.log_level = raw_prio }
      if facility != null { meta.log_facility = facility }

      dev = {
        "type_id": 1,
        "type": "Server",
        "os": {
          "name": "Linux",
          "type_id": 200
        }
      }
      if hostname != null { dev.hostname = hostname }
      if machine_id != null {
        dev.uid = machine_id
        dev.os_machine_uuid = machine_id
      }
      if boot_id != null { dev.boot_uid = boot_id }

      # Collect unmapped fields (excluding consumed canonical and Vector internal fields)
      unmapped = orig
      del(unmapped.MESSAGE)
      del(unmapped.message)
      del(unmapped.timestamp)
      del(unmapped.host)
      del(unmapped.source_type)
      del(unmapped.PRIORITY)
      del(unmapped.SYSLOG_FACILITY)
      del(unmapped.SYSLOG_IDENTIFIER)
      del(unmapped.SYSLOG_PID)
      del(unmapped._HOSTNAME)
      del(unmapped._MACHINE_ID)
      del(unmapped._BOOT_ID)
      del(unmapped._SYSTEMD_UNIT)
      del(unmapped._TRANSPORT)
      del(unmapped._PID)
      del(unmapped._UID)
      del(unmapped._COMM)
      del(unmapped._EXE)
      del(unmapped._CMDLINE)
      del(unmapped.__CURSOR)
      del(unmapped.__REALTIME_TIMESTAMP)
      del(unmapped.__MONOTONIC_TIMESTAMP)
      del(unmapped._SOURCE_REALTIME_TIMESTAMP)
      del(unmapped.__SOURCE_REALTIME_TIMESTAMP)
      del(unmapped.TRACE_ID)
      del(unmapped.OTEL_TRACE_ID)
      del(unmapped.trace_id)
      del(unmapped.SPAN_ID)
      del(unmapped.OTEL_SPAN_ID)
      del(unmapped.span_id)
      if span_clean != null { unmapped.span_id = span_clean }

      out = {
        "category_uid": 1,
        "category_name": "System Activity",
        "class_uid": 1008,
        "class_name": "Event Log Activity",
        "type_uid": 100899,
        "type_name": "Event Log Activity: Other",
        "activity_id": 99,
        "activity_name": "Other",
        "severity_id": severity_id,
        "severity": severity,
        "time": time_ms,
        "time_dt": time_dt,
        "metadata": meta,
        "device": dev
      }
      if msg != null { out.message = msg }
      if log_name != null { out.log_name = log_name }
      if log_provider != null { out.log_provider = log_provider }
      if length(act) > 0 { out.actor = act }
      if length(unmapped) > 0 { out.unmapped = unmapped }

      . = out

  ocsf_otlp_logs:
    type: remap
    inputs:
      - otlp.logs
    source: |
      now_ts = now()

      # Resolve event_ts within 4-digit UTC RFC 3339 bounds ([1, 253402300799999] ms):
      # timestamp -> observed_timestamp -> now()
      obs_ts = now_ts
      obs_valid = false
      if exists(.observed_timestamp) && .observed_timestamp != null {
        if is_timestamp(.observed_timestamp) {
          obs_v = timestamp!(.observed_timestamp)
          oms = to_unix_timestamp(obs_v, unit: "milliseconds")
          if oms >= 1 && oms <= 253402300799999 {
            obs_ts = obs_v
            obs_valid = true
          }
        } else if is_string(.observed_timestamp) {
          obs_str = string!(.observed_timestamp)
          if obs_str != "" {
            parsed_obs, o_err = parse_timestamp(obs_str, "%+")
            if o_err == null {
              oms = to_unix_timestamp(parsed_obs, unit: "milliseconds")
              if oms >= 1 && oms <= 253402300799999 {
                obs_ts = parsed_obs
                obs_valid = true
              }
            }
          }
        }
      }

      event_ts = if obs_valid { obs_ts } else { now_ts }
      if exists(.timestamp) && .timestamp != null {
        if is_timestamp(.timestamp) {
          ts_v = timestamp!(.timestamp)
          tms = to_unix_timestamp(ts_v, unit: "milliseconds")
          if tms >= 1 && tms <= 253402300799999 {
            event_ts = ts_v
          }
        } else if is_string(.timestamp) {
          ts_str = string!(.timestamp)
          if ts_str != "" {
            parsed_ev, t_err = parse_timestamp(ts_str, "%+")
            if t_err == null {
              tms = to_unix_timestamp(parsed_ev, unit: "milliseconds")
              if tms >= 1 && tms <= 253402300799999 {
                event_ts = parsed_ev
              }
            }
          }
        }
      }

      time_ms = to_unix_timestamp(event_ts, unit: "milliseconds")
      time_dt = format_timestamp!(event_ts, "%Y-%m-%dT%H:%M:%S%.3fZ")
      logged_ms = to_unix_timestamp(obs_ts, unit: "milliseconds")

      # Map OTLP severity_number (1..24) strictly to OCSF v1.3.0 severity_id / severity
      sev_num = 0
      if exists(.severity_number) && .severity_number != null {
        if is_integer(.severity_number) {
          sev_num = int!(.severity_number)
        } else if is_string(.severity_number) {
          ss = string!(.severity_number)
          if match(ss, r'^[0-9]{1,3}$') { sev_num = to_int!(ss) }
        }
      }

      severity_id = 0
      severity = "Unknown"
      if sev_num >= 1 && sev_num <= 12 {
        severity_id = 1
        severity = "Informational"
      } else if sev_num >= 13 && sev_num <= 16 {
        severity_id = 3
        severity = "Medium"
      } else if sev_num >= 17 && sev_num <= 20 {
        severity_id = 4
        severity = "High"
      } else if sev_num >= 21 && sev_num <= 24 {
        severity_id = 6
        severity = "Fatal"
      }

      sev_text = if exists(.severity_text) && is_string(.severity_text) && string!(.severity_text) != "" { string!(.severity_text) } else { null }

      res = if exists(.resources) && is_object(.resources) { object!(.resources) } else { {} }
      attrs = if exists(.attributes) && is_object(.attributes) { object!(.attributes) } else { {} }
      scope_name = if exists(.scope.name) && is_string(.scope.name) && string!(.scope.name) != "" { string!(.scope.name) } else { null }
      service_name = if exists(res."service.name") && is_string(res."service.name") && string!(res."service.name") != "" { string!(res."service.name") } else { null }

      log_name = if scope_name != null { scope_name } else { service_name }
      log_provider = "opentelemetry"

      msg = null
      if exists(.message) && .message != null {
        msg = if is_string(.message) { string!(.message) } else { encode_json(.message) }
      }

      correlation_uid = null
      if exists(.trace_id) && is_string(.trace_id) {
        rt = string!(.trace_id)
        if rt != "" {
          tc = if match(rt, r'^[0-9A-Fa-f]+$') { downcase(rt) } else { rt }
          if !match(tc, r'^0+$') { correlation_uid = tc }
        }
      }

      span_clean = null
      if exists(.span_id) && is_string(.span_id) {
        rs = string!(.span_id)
        if rs != "" {
          sc = if match(rs, r'^[0-9A-Fa-f]+$') { downcase(rs) } else { rs }
          if !match(sc, r'^0+$') { span_clean = sc }
        }
      }

      event_uid = null
      if exists(attrs."event.id") && is_string(attrs."event.id") && string!(attrs."event.id") != "" {
        event_uid = string!(attrs."event.id")
      } else if span_clean != null {
        event_uid = span_clean
      }

      hostname = null
      if exists(res."host.name") && is_string(res."host.name") && string!(res."host.name") != "" {
        hostname = string!(res."host.name")
      } else if exists(res."service.instance.id") && is_string(res."service.instance.id") && string!(res."service.instance.id") != "" {
        hostname = string!(res."service.instance.id")
      }

      host_id = if exists(res."host.id") && is_string(res."host.id") && string!(res."host.id") != "" { string!(res."host.id") } else { null }

      # OCSF device.os requires both name and type_id; omit device.os completely if os.type is unknown
      os_obj = null
      if exists(res."os.type") && is_string(res."os.type") {
        os_lc = downcase(string!(res."os.type"))
        if os_lc == "linux" {
          os_obj = { "name": "Linux", "type_id": 200 }
        } else if os_lc == "windows" {
          os_obj = { "name": "Windows", "type_id": 100 }
        } else if os_lc == "darwin" || os_lc == "macos" {
          os_obj = { "name": "macOS", "type_id": 300 }
        }
      }

      pid_val = null
      if exists(res."process.pid") && res."process.pid" != null {
        if is_integer(res."process.pid") {
          pi = int!(res."process.pid")
          if pi >= 0 && pi <= 9007199254740991 { pid_val = pi }
        } else if is_string(res."process.pid") {
          ps = string!(res."process.pid")
          if match(ps, r'^[0-9]{1,15}$') { pid_val = to_int!(ps) }
        }
      }
      if pid_val == null && exists(attrs."process.pid") && attrs."process.pid" != null {
        if is_integer(attrs."process.pid") {
          pi = int!(attrs."process.pid")
          if pi >= 0 && pi <= 9007199254740991 { pid_val = pi }
        } else if is_string(attrs."process.pid") {
          ps = string!(attrs."process.pid")
          if match(ps, r'^[0-9]{1,15}$') { pid_val = to_int!(ps) }
        }
      }

      proc_name = if exists(res."process.executable.name") && is_string(res."process.executable.name") && string!(res."process.executable.name") != "" {
        string!(res."process.executable.name")
      } else {
        service_name
      }
      proc_path = if exists(res."process.executable.path") && is_string(res."process.executable.path") && string!(res."process.executable.path") != "" {
        string!(res."process.executable.path")
      } else { null }
      proc_cmd = if exists(res."process.command_line") && is_string(res."process.command_line") && string!(res."process.command_line") != "" {
        string!(res."process.command_line")
      } else { null }

      uid_str = null
      uid_num = null
      if exists(attrs."user.id") && attrs."user.id" != null {
        if is_integer(attrs."user.id") {
          uv = int!(attrs."user.id")
          if uv >= 0 && uv <= 9007199254740991 {
            uid_str = to_string(uv)
            uid_num = uv
          }
        } else if is_string(attrs."user.id") {
          us = string!(attrs."user.id")
          if us != "" {
            uid_str = us
            if match(us, r'^[0-9]{1,15}$') { uid_num = to_int!(us) }
          }
        }
      }
      if uid_str == null && exists(attrs."enduser.id") && attrs."enduser.id" != null {
        if is_integer(attrs."enduser.id") {
          uv = int!(attrs."enduser.id")
          if uv >= 0 && uv <= 9007199254740991 {
            uid_str = to_string(uv)
            uid_num = uv
          }
        } else if is_string(attrs."enduser.id") {
          us = string!(attrs."enduser.id")
          if us != "" {
            uid_str = us
            if match(us, r'^[0-9]{1,15}$') { uid_num = to_int!(us) }
          }
        }
      }

      user_name = if exists(attrs."user.name") && is_string(attrs."user.name") && string!(attrs."user.name") != "" {
        string!(attrs."user.name")
      } else if exists(attrs."user.full_name") && is_string(attrs."user.full_name") && string!(attrs."user.full_name") != "" {
        string!(attrs."user.full_name")
      } else { null }

      proc = {}
      if pid_val != null { proc.pid = pid_val }
      if proc_name != null { proc.name = proc_name }
      if proc_path != null { proc.path = proc_path }
      if proc_cmd != null { proc.cmd_line = proc_cmd }

      usr = {}
      if uid_str != null { usr.uid = uid_str }
      if uid_num != null { usr.uid_numeric = uid_num }
      if user_name != null { usr.name = user_name }

      act = {}
      if length(proc) > 0 { act.process = proc }
      if length(usr) > 0 { act.user = usr }

      meta = {
        "version": "1.3.0",
        "product": {
          "name": "Vector",
          "vendor_name": "Datadog"
        },
        "logged_time": logged_ms
      }
      if event_uid != null { meta.original_event_uid = event_uid }
      if correlation_uid != null { meta.correlation_uid = correlation_uid }
      if log_name != null { meta.log_name = log_name }
      meta.log_provider = log_provider
      if sev_text != null { meta.log_level = sev_text }

      dev = {
        "type_id": 0,
        "type": "Unknown"
      }
      if hostname != null { dev.hostname = hostname }
      if host_id != null { dev.uid = host_id }
      if os_obj != null { dev.os = os_obj }

      del(attrs."event.id")
      del(attrs."process.pid")
      del(attrs."user.id")
      del(attrs."enduser.id")
      del(attrs."user.name")
      del(attrs."user.full_name")

      del(res."host.name")
      del(res."service.instance.id")
      del(res."host.id")
      del(res."os.type")
      del(res."process.pid")
      del(res."process.executable.name")
      del(res."service.name")
      del(res."process.executable.path")
      del(res."process.command_line")

      unmapped = {}
      if length(attrs) > 0 { unmapped.attributes = attrs }
      if length(res) > 0 { unmapped.resource = res }
      if span_clean != null { unmapped.span_id = span_clean }
      if exists(.dropped_attributes_count) && is_integer(.dropped_attributes_count) && int!(.dropped_attributes_count) > 0 {
        unmapped.dropped_attributes_count = int!(.dropped_attributes_count)
      }

      out = {
        "category_uid": 1,
        "category_name": "System Activity",
        "class_uid": 1008,
        "class_name": "Event Log Activity",
        "type_uid": 100899,
        "type_name": "Event Log Activity: Other",
        "activity_id": 99,
        "activity_name": "Other",
        "severity_id": severity_id,
        "severity": severity,
        "time": time_ms,
        "time_dt": time_dt,
        "metadata": meta,
        "device": dev
      }
      if msg != null { out.message = msg }
      if log_name != null { out.log_name = log_name }
      out.log_provider = log_provider
      if length(act) > 0 { out.actor = act }
      if length(unmapped) > 0 { out.unmapped = unmapped }

      . = out

sinks:
  basin_http:
    type: http
    inputs:
      - ocsf_journald
      - ocsf_otlp_logs
    uri: "${OOF_BASIN_ENDPOINT}"
    method: post
    compression: gzip
    encoding:
      codec: json
    auth:
      strategy: bearer
      token: "${OOF_INGEST_TOKEN}"
    batch:
      max_events: 500
      max_bytes: 5000000
      timeout_secs: 5
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    request:
      retry_attempts: 5
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 30

  unused_otlp_apm:
    type: blackhole
    inputs:
      - otlp.metrics
      - otlp.traces
    print_interval_secs: 0

tests:
  - name: ocsf_journald_sshd_failure
    inputs:
      - insert_at: ocsf_journald
        type: log
        log_fields:
          MESSAGE: "Failed password for root from 198.51.100.10 port 51234 ssh2"
          PRIORITY: "3"
          SYSLOG_FACILITY: "10"
          SYSLOG_IDENTIFIER: "sshd"
          _SYSTEMD_UNIT: "sshd.service"
          _TRANSPORT: "syslog"
          _HOSTNAME: "edge-01"
          _MACHINE_ID: "mach-001"
          _BOOT_ID: "boot-001"
          _PID: "4242"
          _UID: "0"
          _COMM: "sshd"
          _EXE: "/usr/sbin/sshd"
          _CMDLINE: "sshd: root [priv]"
          _SOURCE_REALTIME_TIMESTAMP: "1731676800123456"
          __REALTIME_TIMESTAMP: "1731676800125000"
          __CURSOR: "cursor-123"
          CUSTOM_TAG: "auth-audit"
    outputs:
      - extract_from: ocsf_journald
        conditions:
          - type: vrl
            source: |
              .category_uid == 1 &&
              .class_uid == 1008 &&
              .activity_id == 99 &&
              .type_uid == 100899 &&
              .severity_id == 4 &&
              .severity == "High" &&
              .time == 1731676800123 &&
              .time_dt == "2024-11-15T13:20:00.123Z" &&
              .device.os.type_id == 200 &&
              .actor.process.pid == 4242 &&
              .actor.user.uid == "0" &&
              .actor.user.uid_numeric == 0 &&
              .metadata.version == "1.3.0" &&
              .unmapped.CUSTOM_TAG == "auth-audit"

  - name: ocsf_otlp_error_with_trace
    inputs:
      - insert_at: ocsf_otlp_logs
        type: log
        log_fields:
          timestamp: "2025-01-10T08:00:00.250Z"
          observed_timestamp: "2025-01-10T08:00:00.300Z"
          severity_number: 17
          severity_text: "ERROR"
          message: "upstream payment timeout"
          trace_id: "0af7651916cd43dd8448eb211c80319c"
