              .activity_id == 99 &&
              .type_uid == 100899 &&
              .severity_id == 4 &&
              .severity == "High" &&
              .log_name == "checkout-logger" &&
              .log_provider == "opentelemetry" &&
              .metadata.correlation_uid == "0af7651916cd43dd8448eb211c80319c" &&
              .metadata.original_event_uid == "b7ad6b7169203331" &&
              .device.os.name == "Linux" &&
              .device.os.type_id == 200 &&
