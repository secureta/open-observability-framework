            service.name: "checkout-api"
            host.name: "app-02"
            os.type: "linux"
            deployment.environment: "prod"
          attributes:
            user.id: "1001"
            order.id: "ord-99"
    outputs:
      - extract_from: ocsf_otlp_logs
        conditions:
          - type: vrl
            source: |
              .category_uid == 1 &&
