# Open Observability Framework — OpenTelemetry Collector Bridge (OTLP -> Vector / Fluent Bit OCSF -> Basin)
#
# Use this adapter when applications emit OTLP traces/metrics/logs to OpenTelemetry Collector
# (`127.0.0.1:4317` / `127.0.0.1:4318`) and you want to forward OTLP logs to a local or remote
# Vector / Fluent Bit OCSF collector, which normalizes events into OCSF v1.3.0 (class 1008)
# and ships them to Cloudflare Basin HTTP with a Basin Account API Token.
#
# Anti-loop & port-isolation note:
#   Default exporter endpoint is `http://127.0.0.1:4320` (distinct from this collector's
#   `4317`/`4318` receiver ports so running `otelcol` locally never self-loops).
#   - Co-located on same host as Vector: run Vector with `OOF_OTLP_HTTP_LISTEN=127.0.0.1:4320`.
#   - Co-located on same host as Fluent Bit: set `opentelemetry` input `Port 4320`.
#   - Forwarding to a central Vector/Fluent Bit gateway: set `OOF_OTLP_BRIDGE_ENDPOINT=http://ocsf-gateway.internal:4318`.
#
# IMPORTANT — Prevent duplicate journald ingestion:
#   Leave the `journald` receiver commented out below whenever Vector (`systemd_journal` / `journald`)
#   or Fluent Bit (`systemd`) is already collecting journald on the same host.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "${env:OOF_OTEL_GRPC_LISTEN:-127.0.0.1:4317}"
      http:
        endpoint: "${env:OOF_OTEL_HTTP_LISTEN:-127.0.0.1:4318}"

  # Enable ONLY if `otelcol` is the sole journald collector on the host (never alongside Vector/Fluent Bit journald):
  # journald:
  #   directory: /var/log/journal
  #   operators:
  #     - type: move
  #       from: body._HOSTNAME
  #       to: resource["host.name"]
  #       if: 'body._HOSTNAME != nil'
  #     - type: move
  #       from: body._MACHINE_ID
  #       to: resource["host.id"]
  #       if: 'body._MACHINE_ID != nil'
  #     - type: move
  #       from: body.__CURSOR
  #       to: attributes["event.id"]
  #       if: 'body.__CURSOR != nil'
  #     - type: move
  #       from: body._PID
  #       to: attributes["process.pid"]
  #       if: 'body._PID != nil'
  #     - type: move
  #       from: body._UID
  #       to: attributes["user.id"]
  #       if: 'body._UID != nil'

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
  batch:
    send_batch_size: 256
    timeout: 2s

exporters:
  # Use `encoding: proto` (protobuf over HTTP), accepted by both Vector (>= 0.60) and Fluent Bit (>= 3.x/5.x).
  otlphttp/ocsf_bridge:
    endpoint: "${env:OOF_OTLP_BRIDGE_ENDPOINT:-http://127.0.0.1:4320}"
    encoding: proto
    compression: gzip

  # Optional future APM extension exporters (enable in pipelines when apm.enabled = true):
  # otlphttp/apm_traces:
  #   traces_endpoint: "${env:OOF_TRACES_URL}"
  # otlphttp/apm_metrics:
  #   metrics_endpoint: "${env:OOF_METRICS_URL}"

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/ocsf_bridge]
    # traces:
    #   receivers: [otlp]
    #   processors: [memory_limiter, resourcedetection, batch]
    #   exporters: [otlphttp/apm_traces]
    # metrics:
    #   receivers: [otlp]
    #   processors: [memory_limiter, resourcedetection, batch]
    #   exporters: [otlphttp/apm_metrics]
