# Open Observability Framework — Fluent Bit Collector (OCSF v1.3.0 -> Direct Basin HTTP)
#
# Collects Linux host `systemd-journald` events AND local OTLP logs (`127.0.0.1:4318`),
# normalizes both via `ocsf.lua` into official OCSF v1.3.0 `Event Log Activity` (`1008`),
# strips OTLP `group_attributes` via an authenticated loopback `forward` hop so `http` output
# never injects `"__internal__"`, and ships gzipped JSON arrays directly to Cloudflare Basin HTTP.
#
# Trust boundary: the `opentelemetry` input is unauthenticated, so OTLP host / process / user
# attributes are sender claims; `ocsf.lua` keeps them under `unmapped` and never maps them into
# `device` / `actor` (`device.hostname` is this collector host). Keep `Listen 127.0.0.1`.
#
# Required environment variables:
#   OOF_BASIN_HOST     (hostname only, e.g. <STREAM_ID>.ingest.cloudflare.com)
#   OOF_INGEST_TOKEN   (Cloudflare Account API Token with `Basin Pipelines Send`;
#                       also authenticates the local loopback forward hop)
#
# Fluent Bit caveats enforced below:
#   1. Fluent Bit does NOT support `:-` default env fallback syntax; keep static values explicit.
#   2. `json_date_key false` suppresses Fluent Bit's injected `"date"` float field.
#   3. `tls.verify_hostname On` is explicitly set (defaults to Off in Fluent Bit `http` output).
#   4. `to_ocsf` declares 5 explicit parameters so `filter_lua` delivers OTLP `group` and `metadata`.
#   5. Routing `oof.otlp_raw` through loopback `forward` (`127.0.0.1:24225`) with
#      `retain_metadata_in_forward_mode false` strips OTLP `group_attributes` cleanly so
#      `http` output never emits `"__internal__"`.
#   6. If co-locating OTel Collector on the same host, change `opentelemetry` Port to 4320.

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info

[INPUT]
    Name               systemd
    Tag                oof.journald
    Read_From_Tail     On
    Strip_Underscores  Off

[INPUT]
    Name               opentelemetry
    Tag                oof.otlp_raw
    Listen             127.0.0.1
    Port               4318
    tag_from_uri       false
    logs_body_key      body

[INPUT]
    Name               forward
    Listen             127.0.0.1
    Port               24225
    Shared_Key         ${OOF_INGEST_TOKEN}
    Self_Hostname      localhost

[FILTER]
    Name               lua
    Match_Regex        ^oof\.(journald|otlp_raw)$
    Script             ocsf.lua
    Call               to_ocsf
    Time_As_Table      On

[OUTPUT]
    Name                             forward
    Match                            oof.otlp_raw
    Host                             127.0.0.1
    Port                             24225
    Tag                              oof.otlp
    Shared_Key                       ${OOF_INGEST_TOKEN}
    Self_Hostname                    localhost
    Require_ack_response             true
    retain_metadata_in_forward_mode  false

[OUTPUT]
    Name                 http
    Match_Regex          ^oof\.(journald|otlp)$
    Host                 ${OOF_BASIN_HOST}
    Port                 443
    URI                  /
    Format               json
    json_date_key        false
    Compress             gzip
    Header               Authorization Bearer ${OOF_INGEST_TOKEN}
    tls                  On
    tls.verify           On
    tls.verify_hostname  On
    Retry_Limit          5
