# Open Observability Framework — Vector Cloudflare Audit Logs Collector (OCSF v1.3.0 -> Direct Basin HTTP)
#
# Polls the Cloudflare Account Audit Logs REST API (v4), expands the `result` array,
# normalizes each audit entry into official OCSF v1.3.0 `Event Log Activity`
# (`category_uid: 1`, `class_uid: 1008`, `activity_id: 99`, `type_uid: 100899`),
# and ships gzipped JSON arrays directly to Cloudflare Basin HTTP (`direct-basin-http`).
#
# Required environment variables:
#   OOF_BASIN_ENDPOINT          (e.g. https://<STREAM_ID>.ingest.cloudflare.com)
#   OOF_INGEST_TOKEN            (Cloudflare Account API Token with `Basin Pipelines Send`)
#   OOF_CLOUDFLARE_ACCOUNT_ID   (32-hex Cloudflare Account ID)
#   OOF_CLOUDFLARE_API_TOKEN    (Cloudflare API Token with `Account -> Audit Logs -> Read`)
#
# Optional environment variables:
#   OOF_VECTOR_DATA_DIR         (default: /var/lib/vector)
#   OOF_CLOUDFLARE_API_BASE_URL (default: https://api.cloudflare.com/client/v4)
#   OOF_CLOUDFLARE_AUDIT_PER_PAGE (default: 100)
#
# Vector >= 0.60 note:
#   Interpolating environment variables (e.g. `$OOF_BASIN_ENDPOINT` with braces) requires `--dangerously-allow-env-var-interpolation`
#   (or `VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true`):
#     VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true vector validate --no-environment adapters/collect/vector-cloudflare-audit-logs/vector.yaml
#     VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true vector test adapters/collect/vector-cloudflare-audit-logs/vector.yaml

data_dir: "${OOF_VECTOR_DATA_DIR:-/var/lib/vector}"

sources:
  cloudflare_audit_logs_api:
    type: http_client
    endpoint: "${OOF_CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}/accounts/${OOF_CLOUDFLARE_ACCOUNT_ID}/audit_logs?per_page=${OOF_CLOUDFLARE_AUDIT_PER_PAGE:-100}&direction=desc"
    method: GET
    scrape_interval_secs: 60
    scrape_timeout_secs: 15
    auth:
      strategy: bearer
      token: "${OOF_CLOUDFLARE_API_TOKEN}"
    decoding:
      codec: json
    tls:
      verify_certificate: true
      verify_hostname: true

transforms:
  expand_cloudflare_audit_logs:
    type: remap
    inputs:
      - cloudflare_audit_logs_api
    source: |
      if !exists(.result) || !is_array(.result) {
        abort
      }
      . = .result

  ocsf_cloudflare_audit_logs:
    type: remap
    inputs:
      - expand_cloudflare_audit_logs
    source: |
      now_ts = now()
      logged_ms = to_unix_timestamp(now_ts, unit: "milliseconds")

      if !is_object(.) {
        abort
      }

      audit_id = if exists(.id) && is_string(.id) && string!(.id) != "" { string!(.id) } else { null }
      action_type = if exists(.action.type) && is_string(.action.type) && string!(.action.type) != "" {
        string!(.action.type)
      } else {
        "unknown"
      }
      action_result = if exists(.action.result) && is_boolean(.action.result) { bool!(.action.result) } else { null }
      action_info = if exists(.action.info) && is_string(.action.info) && string!(.action.info) != "" { string!(.action.info) } else { null }

      actor_id = if exists(.actor.id) && is_string(.actor.id) && string!(.actor.id) != "" { string!(.actor.id) } else { null }
      actor_email = if exists(.actor.email) && is_string(.actor.email) && string!(.actor.email) != "" { string!(.actor.email) } else { null }
      actor_ip = if exists(.actor.ip) && is_string(.actor.ip) && string!(.actor.ip) != "" { string!(.actor.ip) } else { null }
      actor_type = if exists(.actor.type) && is_string(.actor.type) && string!(.actor.type) != "" { string!(.actor.type) } else { null }

      owner_id = if exists(.owner.id) && is_string(.owner.id) && string!(.owner.id) != "" { string!(.owner.id) } else { null }
      resource_id = if exists(.resource.id) && is_string(.resource.id) && string!(.resource.id) != "" { string!(.resource.id) } else { null }
      resource_type = if exists(.resource.type) && is_string(.resource.type) && string!(.resource.type) != "" { string!(.resource.type) } else { null }
      iface = if exists(.interface) && is_string(.interface) && string!(.interface) != "" { string!(.interface) } else { null }

      raw_ts_str = if exists(.when) && is_string(.when) && string!(.when) != "" { string!(.when) } else { null }

      # Resolve event_ts within 4-digit UTC RFC 3339 bounds ([1, 253402300799999] ms)
      event_ts = now_ts
      if raw_ts_str != null {
        parsed_ev, t_err = parse_timestamp(raw_ts_str, "%+")
        if t_err == null {
          tms = to_unix_timestamp(parsed_ev, unit: "milliseconds")
          if tms >= 1 && tms <= 253402300799999 {
            event_ts = parsed_ev
          }
        }
      }
      time_ms = to_unix_timestamp(event_ts, unit: "milliseconds")
      time_dt = format_timestamp!(event_ts, "%Y-%m-%dT%H:%M:%S%.3fZ")

      # Severity mapping: failed actions -> High (4); sensitive mutations -> Medium (3); normal success -> Informational (1)
      action_lc = downcase(action_type)
      res_lc = if resource_type != null { downcase(string!(resource_type)) } else { "" }
      severity_id = 1
      severity = "Informational"
      log_level = "info"

      if action_result == false {
        severity_id = 4
        severity = "High"
        log_level = "error"
      } else if (
        contains(action_lc, "delete") ||
        contains(action_lc, "revoke") ||
        contains(action_lc, "remove") ||
        contains(action_lc, "purge") ||
        contains(res_lc, "token") ||
        contains(res_lc, "member") ||
        contains(res_lc, "role") ||
        contains(res_lc, "firewall") ||
        contains(res_lc, "waf") ||
        contains(res_lc, "access") ||
        contains(res_lc, "zero_trust")
      ) {
        severity_id = 3
        severity = "Medium"
        log_level = "warn"
      }

      usr = {}
      if actor_id != null { usr.uid = actor_id }
      if actor_email != null {
        usr.name = actor_email
      } else if actor_type != null {
        usr.name = actor_type
      }

      act = {}
      if length(usr) > 0 { act.user = usr }

      dev = {
        "type_id": 99,
        "type": "Other",
        "hostname": "cloudflare.com"
      }
      if owner_id != null { dev.uid = owner_id }

      log_provider = "cloudflare-audit-logs"
      log_name = if resource_type != null {
        string!(resource_type) + ":" + action_type
      } else {
        action_type
      }

      res_label = if resource_type != null { string!(resource_type) } else { "account" }
      actor_label = if actor_email != null { string!(actor_email) } else if actor_id != null { string!(actor_id) } else { "unknown-actor" }
      outcome_label = if action_result == false { "failed" } else { "succeeded" }
      msg = "cloudflare audit " + action_type + " on " + res_label + " by " + actor_label + " (" + outcome_label + ")"

      meta = {
        "version": "1.3.0",
        "product": {
          "name": "Vector",
          "vendor_name": "Datadog"
        },
        "logged_time": logged_ms,
        "log_provider": log_provider,
        "log_name": log_name,
        "log_level": log_level
      }
      if audit_id != null { meta.original_event_uid = audit_id }
      if raw_ts_str != null { meta.original_time = raw_ts_str }

      unmapped = {
        "cloudflare_dataset": "audit_logs",
        "action_type": action_type
      }
      if audit_id != null { unmapped.audit_log_id = audit_id }
      if action_result != null { unmapped.action_result = action_result }
      if action_info != null { unmapped.action_info = action_info }
      if actor_type != null { unmapped.actor_type = actor_type }
      if actor_ip != null { unmapped.actor_ip = actor_ip }
      if owner_id != null { unmapped.owner_id = owner_id }
      if resource_type != null { unmapped.resource_type = resource_type }
      if resource_id != null { unmapped.resource_id = resource_id }
      if iface != null { unmapped.interface = iface }

      out = {
        "category_uid": 1,
        "category_name": "System Activity",
        "class_uid": 1008,
        "class_name": "Event Log Activity",
        "type_uid": 100899,
        "type_name": "Event Log Activity: Other",
        "activity_id": 99,
        "activity_name": "Other",
        "severity_id": severity_id,
        "severity": severity,
        "time": time_ms,
        "time_dt": time_dt,
        "message": msg,
        "log_name": log_name,
        "log_provider": log_provider,
        "metadata": meta,
        "device": dev,
        "unmapped": unmapped
      }
      if length(act) > 0 { out.actor = act }

      . = out

sinks:
  basin_http:
    type: http
    inputs:
      - ocsf_cloudflare_audit_logs
    uri: "${OOF_BASIN_ENDPOINT}"
    method: post
    compression: gzip
    tls:
      verify_certificate: true
      verify_hostname: true
    encoding:
      codec: json
    auth:
      strategy: bearer
      token: "${OOF_INGEST_TOKEN}"
    batch:
      max_events: 500
      max_bytes: 5000000
      timeout_secs: 5
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    request:
      retry_attempts: 5
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 30

tests:
  - name: ocsf_cloudflare_audit_log_fanout_and_normalize
    inputs:
      - insert_at: expand_cloudflare_audit_logs
        type: log
        log_fields:
          success: true
          result:
            - id: "audit-001"
              when: "2026-03-01T12:00:00Z"
              interface: "API"
              action:
                type: "rec_add"
                result: true
              actor:
                id: "user-123"
                email: "alice@example.com"
                ip: "198.51.100.10"
                type: "user"
              owner:
                id: "0123456789abcdef0123456789abcdef"
              resource:
                id: "dns-rec-001"
                type: "DNS_record"
            - id: "audit-002"
              when: "2026-03-01T12:01:00Z"
              interface: "UI"
              action:
                type: "token_create"
                result: false
                info: "permission denied"
              actor:
                id: "user-456"
                email: "bob@example.com"
                ip: "203.0.113.20"
                type: "user"
              owner:
                id: "0123456789abcdef0123456789abcdef"
              resource:
                id: "tok-999"
                type: "api_token"
    outputs:
      - extract_from: ocsf_cloudflare_audit_logs
        conditions:
          - type: vrl
            source: |
              .category_uid == 1 &&
              .class_uid == 1008 &&
              .activity_id == 99 &&
              .type_uid == 100899 &&
              .log_provider == "cloudflare-audit-logs" &&
              .metadata.version == "1.3.0" &&
              .metadata.original_event_uid == "audit-001" &&
              .severity_id == 1 &&
              .severity == "Informational" &&
              .actor.user.name == "alice@example.com" &&
              .actor.user.uid == "user-123" &&
              .device.hostname == "cloudflare.com" &&
              .device.uid == "0123456789abcdef0123456789abcdef" &&
              .unmapped.cloudflare_dataset == "audit_logs" &&
              .unmapped.action_type == "rec_add" &&
              .unmapped.actor_ip == "198.51.100.10"
          - type: vrl
            source: |
              .metadata.original_event_uid == "audit-002" &&
              .severity_id == 4 &&
              .severity == "High" &&
              .actor.user.name == "bob@example.com" &&
              .unmapped.action_result == false &&
              .unmapped.resource_type == "api_token"

  - name: ocsf_cloudflare_audit_log_sensitive_mutation_medium
    inputs:
      - insert_at: ocsf_cloudflare_audit_logs
        type: log
        log_fields:
          id: "audit-003"
          when: "2026-03-01T12:05:00Z"
          interface: "API"
          action:
            type: "delete"
            result: true
          actor:
            id: "user-789"
            email: "secops@example.com"
            type: "user"
          owner:
            id: "0123456789abcdef0123456789abcdef"
          resource:
            id: "waf-rule-42"
            type: "firewall_rule"
    outputs:
      - extract_from: ocsf_cloudflare_audit_logs
        conditions:
          - type: vrl
            source: |
              .severity_id == 3 &&
              .severity == "Medium" &&
              .log_name == "firewall_rule:delete" &&
              .unmapped.resource_id == "waf-rule-42"
